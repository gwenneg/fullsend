---
# fullsend-component: lint
# fullsend lint caller (per-repo installation mode)
# `fullsend repos install` writes this workflow while the repository's
# effective `lint` setting in repos.yaml is true, and removes it otherwise.
#
# reusable-fullsend-lint.yml installs the Fullsend CLI at the ref it is pinned
# to and runs `fullsend lint --fullsend-dir .fullsend`. Install pins it to the
# same ref as the fullsend workflow, so the check and the agents use one
# Fullsend version.
#
# The check also runs when this file changes, so a pull request that moves
# the pin is linted with the new version. Do not make it a required status
# check: pull requests that touch neither path never report it.
#
# Security: runs on pull_request with a read-only token and no secrets.
name: fullsend lint

on:
  pull_request:
    paths:
      - ".fullsend/**"
      - ".github/workflows/fullsend-lint.yml"

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: gwenneg/fullsend/.github/workflows/reusable-fullsend-lint.yml@e48832d11ade11498a8afec0776270ba4dc65bce
